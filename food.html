<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #faf7f2; margin: 0; }
        .container { max-width: 900px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px #e2e2e2; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #d35400; margin-bottom: 0; }
        .menu-list { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
        .menu-item { background: #fdf6f0; border: 1px solid #f1e1d6; border-radius: 8px; width: 220px; padding: 16px; text-align: center; }
        .menu-item img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; }
        .menu-item h2 { font-size: 18px; margin: 10px 0 8px; color: #b04c00; }
        .menu-item p { font-size: 15px; color: #7f7f7f; }
        .menu-item .price { font-weight: bold; color: #27ae60; margin-bottom: 8px; }
        .menu-item button { background: #d35400; color: #fff; border: none; border-radius: 5px; padding: 8px 16px; cursor: pointer; }
        .menu-item button:hover { background: #b04c00; }
        #order { margin-top: 32px; }
        #order h2 { margin-bottom: 10px; }
        #order-list { list-style: none; padding: 0; }
        #order-list li { padding: 6px 0; border-bottom: 1px solid #f1e1d6; }
        #total { font-weight: bold; margin-top: 10px; color: #27ae60;}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Food Menu</h1>
            <p>Delicious choices for every taste!</p>
        </header>
        <section class="menu-list" id="menu-list">
            <!-- Menu items will be rendered here -->
        </section>
        <section id="order">
            <h2>Your Order</h2>
            <ul id="order-list"></ul>
            <span id="total"></span>
        </section>
    </div>
    <script>
        // Sample menu items
        const menu = [
            { id: 1, name: "Margherita Pizza", price: 8.99, image: "https://via.placeholder.com/120?text=Pizza", desc: "Classic cheese & tomato pizza." },
            { id: 2, name: "Veg Burger", price: 5.49, image: "https://via.placeholder.com/120?text=Burger", desc: "Fresh veggie patty with crispy lettuce." },
            { id: 3, name: "Pasta Alfredo", price: 7.99, image: "https://via.placeholder.com/120?text=Pasta", desc: "Creamy Alfredo sauce over penne." },
            { id: 4, name: "Caesar Salad", price: 4.99, image: "https://via.placeholder.com/120?text=Salad", desc: "Romaine lettuce, croutons & Caesar dressing." },
            { id: 5, name: "French Fries", price: 3.49, image: "https://via.placeholder.com/120?text=Fries", desc: "Golden, crispy potato fries." }
        ];

        const order = [];
        function renderMenu() {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = '';
            menu.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <h2>${item.name}</h2>
                    <div class="price">$${item.price.toFixed(2)}</div>
                    <p>${item.desc}</p>
                    <button onclick="addToOrder(${item.id})">Add to Order</button>
                `;
                menuList.appendChild(div);
            });
        }

        function addToOrder(itemId) {
            const item = menu.find(m => m.id === itemId);
            const orderItem = order.find(o => o.item.id === itemId);
            if (orderItem) {
                orderItem.qty += 1;
            } else {
                order.push({ item, qty: 1 });
            }
            renderOrder();
        }

        function renderOrder() {
            const orderList = document.getElementById('order-list');
            orderList.innerHTML = '';
            let total = 0;
            order.forEach(o => {
                total += o.item.price * o.qty;
                const li = document.createElement('li');
                li.textContent = `${o.item.name} x${o.qty} - $${(o.item.price * o.qty).toFixed(2)}`;
                orderList.appendChild(li);
            });
            document.getElementById('total').textContent = total ? `Total: $${total.toFixed(2)}` : '';
        }

        renderMenu();
        renderOrder();
    </script>
</body>
</html>
